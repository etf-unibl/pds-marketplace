# Guard of the PDS student plugins: commands that change the repository or GitHub are
# denied; the assistant shows and explains them, and the student runs them.

[[rule]]
toolName = "run_shell_command"
commandPrefix = "git add"
decision = "deny"
priority = 500
denyMessage = "PDS plugin rule (teach, don't execute): show the student this command, explain it, say how to check and undo it; the student runs it. Do not try another way to run it."

