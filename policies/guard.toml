# Files in assignments/ are graded work: explain the change, the student applies it
[[rule]]
toolName = ["write_file", "replace"]
argsPattern = "assignments[\\\\/]"
decision = "deny"
priority = 600
denyMessage = "PDS plugin rule: files in assignments/ are graded work; show the change, the student applies it."
