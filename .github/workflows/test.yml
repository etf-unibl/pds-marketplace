# Tests of the pds-tools package (with GHDL, as used by the course CI)
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pds-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/pds-tools

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup GHDL
        if: runner.os == 'Linux'
        uses: ghdl/setup-ghdl@v1
        with:
          version: latest
          backend: mcode

      - name: Install
        run: python -m pip install ".[test]"

      - name: Profiles
        run: pds-mcp --list

      - name: Tests
        run: python -m pytest -q
